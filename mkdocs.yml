site_name: WikiQigong
site_url: https://wikiqigong.com/
site_description: >-
  A clear English guide to Tai Chi, Qigong, and Chinese mind–body practices —
  deep Chinese understanding translated into natural, accurate English
  education for beginners and practitioners.
site_author: WikiQigong Editorial Team

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Core Articles:
      - What Is Qi?: articles/what-is-qi.md
      - What Is the Dantian?: articles/what-is-dantian.md
      - Yin and Yang: articles/yin-yang.md
      - What Is Qigong?: articles/what-is-qigong.md
      - What Is Tai Chi?: articles/what-is-tai-chi.md
      - Qigong Principles: articles/qigong-principles.md
      - Tai Chi Principles: articles/tai-chi-principles.md
      - Dao Yin: articles/dao-yin.md
      - The Three Treasures: articles/three-treasures.md
      - Song (Relaxed Release): articles/song.md
      - Tai Chi Five Styles: articles/tai-chi-five-styles.md
      - Wuji (The Uncarved State): articles/wuji.md
      - Neigong (The Internal Work): articles/neigong.md
      - Meridians (The Body's Channels): articles/meridians.md
      - Silk Reeling (Spiral Power): articles/silk-reeling.md
  - Practices:
      - Tai Chi for Beginners: articles/tai-chi-beginners-first-session.md
      - Baduanjin: articles/baduanjin.md
      - Liu Zi Jue (Six Healing Sounds): articles/liu-zi-jue.md
      - Wu Qin Xi (Five Animal Frolics): articles/wu-qin-xi.md
      - Yi Jin Jing (Muscle/Tendon Change Classic): articles/yi-jin-jing.md
      - Tai Chi 24-Form: articles/tai-chi-24-form.md
      - Zhan Zhuang: articles/zhan-zhuang.md
      - Qigong Breathing: articles/qigong-breathing.md
      - Rooting (Connection to the Ground): articles/rooting.md
      - Push Hands (Partner Practice): articles/push-hands.md
  - Comparisons:
      - Tai Chi vs Qigong: articles/tai-chi-vs-qigong.md
      - Qigong vs Yoga: articles/qigong-vs-yoga.md
      - Qigong vs Meditation: articles/qigong-vs-meditation.md
  - Glossary:
      - glossary/index.md
      - Core Concepts:
          - Qi: glossary/qi.md
          - Dantian: glossary/dantian.md
          - Yin–Yang: glossary/yin-yang.md
          - Jing: glossary/jing.md
          - Shen: glossary/shen.md
          - Qigong: glossary/qigong.md
          - Tai Chi: glossary/tai-chi.md
          - Neigong: glossary/neigong.md
      - Practice:
          - Breathing: glossary/breathing.md
          - Liu Zi Jue: glossary/liu-zi-jue.md
          - Wu Qin Xi: glossary/wu-qin-xi.md
          - Yi Jin Jing: glossary/yi-jin-jing.md
          - Meditation: glossary/meditation.md
          - Zhan Zhuang: glossary/zhan-zhuang.md
          - Rooting (Gen): glossary/gen.md
          - Sinking (Chen): glossary/chen.md
          - Silk Reeling (Chan Si Jing): glossary/silk-reeling.md
          - Push Hands (Tui Shou): glossary/tui-shou.md
      - Philosophy:
          - Wu Xing: glossary/wu-xing.md
          - Balance: glossary/balance.md
          - Dao Yin: glossary/dao-yin.md
          - Song: glossary/song.md
          - San Bao: glossary/san-bao.md
          - Wuji: glossary/wuji.md
          - Xing, Yi, Qi: glossary/xing-yi-qi.md
      - Body-Map:
          - Jingluo (Meridians): glossary/jingluo.md
          - San Guan (Three Gates): glossary/san-guan.md
          - Ming Men (Life Gate): glossary/ming-men.md
          - Lao Gong (Palm Point): glossary/lao-gong.md
      - Tradition:
          - Tai Chi Styles: glossary/tai-chi-styles.md
  - About & Standards:
      - About WikiQigong: about.md
      - Editorial Standards: editorial-standards.md
      - Medical Disclaimer: disclaimer.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/martinxionbiotech-max/wikiqigong
