site_name: WikiQigong
site_url: https://wikiqigong.com/
site_description: >-
  A clear English guide to Tai Chi, Qigong, and Chinese mind–body practices —
  deep Chinese understanding translated into natural, accurate English
  education for beginners and practitioners.
site_author: WikiQigong Editorial Team
copyright: >-
  © 2026 WikiQigong. Educational resource only — not medical advice. See the
  <a href="/disclaimer/">Medical Disclaimer</a>.

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.png
  logo: assets/favicon.png

